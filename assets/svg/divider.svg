<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 120" width="1200" height="120">
  <title>Puncak Yang Sepi - Elegant Divider</title>
  <desc>Minimal futuristic decorative divider with flowing lines, leaves and a central star.</desc>

  <g fill="none" stroke="#f4f1f6" stroke-linecap="round" stroke-linejoin="round">
    <!-- Main flowing lines -->
    <path d="M40 60 H245 C285 60 310 52 345 45 C380 38 405 43 440 60" stroke-width="1.4"/>
    <path d="M1160 60 H955 C915 60 890 52 855 45 C820 38 795 43 760 60" stroke-width="1.4"/>

    <!-- Secondary subtle curves -->
    <path d="M145 60 C190 60 215 74 255 74 C292 74 315 64 350 60" stroke-width="0.8" opacity="0.65"/>
    <path d="M1055 60 C1010 60 985 74 945 74 C908 74 885 64 850 60" stroke-width="0.8" opacity="0.65"/>
  </g>

  <!-- Small geometric accents -->
  <g fill="#f4f1f6">
    <path d="M425 60 L430 55 L435 60 L430 65 Z"/>
    <path d="M775 60 L770 55 L765 60 L770 65 Z"/>
    <circle cx="455" cy="60" r="1.8"/>
    <circle cx="745" cy="60" r="1.8"/>
  </g>

  <!-- Small leaves -->
  <g fill="none" stroke="#f4f1f6" stroke-width="1" stroke-linecap="round">
    <path d="M365 48 C350 32 333 35 326 48 C340 53 354 53 365 48 Z"/>
    <path d="M380 69 C366 82 351 80 345 69 C357 65 370 65 380 69 Z"/>
    <path d="M835 48 C850 32 867 35 874 48 C860 53 846 53 835 48 Z"/>
    <path d="M820 69 C834 82 849 80 855 69 C843 65 830 65 820 69 Z"/>
  </g>

  <!-- Central ornament -->
  <g transform="translate(600 60)">
    <circle cx="0" cy="0" r="27" fill="none" stroke="#f4f1f6" stroke-width="0.8" opacity="0.55"/>

    <!-- Four-point star -->
    <path d="M0 -31 L5 -6 L31 0 L5 6 L0 31 L-5 6 L-31 0 L-5 -6 Z" fill="#f4f1f6"/>

    <!-- Inner diamond -->
    <path d="M0 -6 L6 0 L0 6 L-6 0 Z" fill="#ffffff"/>

    <!-- Orbit points -->
    <circle cx="0" cy="-39" r="1.5" fill="#f4f1f6"/>
    <circle cx="0" cy="39" r="1.5" fill="#f4f1f6"/>
  </g>
</svg>
