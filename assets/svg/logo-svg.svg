  width="800"
  height="1024"
  viewBox="0 0 1536 1024"
  fill="none"
  xmlns="http://www.w3.org/2000/svg"
>
  <rect width="1536" height="1024" fill="#F7F7F8"/>

  <g id="left-lines" opacity="0.85">
