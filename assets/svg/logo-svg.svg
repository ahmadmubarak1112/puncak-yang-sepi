    <line x1="70" y1="460" x2="260" y2="460" stroke="#9C8AB8" stroke-width="3" stroke-linecap="round"/>
    <line x1="45" y1="485" x2="260" y2="485" stroke="#9C8AB8" stroke-width="3" stroke-linecap="round"/>
